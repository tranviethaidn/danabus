# ==============================================================================
# NGINX CONFIGURATION FOR DANABUS PWA (danabus.638686.xyz)
# Production Security Hardening - Explicit Public Root & Defense-in-depth
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name danabus.638686.xyz;

    # Cho phép Let's Encrypt Certbot xác thực SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danabus.638686.xyz;

    # Explicit Public Document Root (cách ly hoàn toàn khỏi workspace)
    root /var/www/danabus/public;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/manifest+json image/svg+xml;

    # Security Headers (server level - áp dụng cho index.html và SPA fallback)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cho phép Let's Encrypt Certbot xác thực SSL qua HTTPS nếu cần
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --------------------------------------------------------------------------
    # Defense-in-depth Rules: Fail-closed with HTTP 404
    # --------------------------------------------------------------------------
    # 1. Chặn dotfiles/thư mục ẩn (.git, .env, .gitignore...) ngoại trừ .well-known
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # 2. Chặn các thư mục nội bộ / development / prototypes
    location ~* (^/(?:\.git|docs|scripts|stitch_bus_route_finder_pwa)|osm_cache)(?:/|$) {
        return 404;
    }

    # 3. Chặn các file nội bộ / documentation / scripts / code nguồn
    location ~* \.(?:md|txt|sh|py|conf|ts|bak|log)$ {
        return 404;
    }

    # --------------------------------------------------------------------------
    # PWA Core Assets & Cache Strategies
    # Lưu ý: Các block có add_header phải lặp lại security headers để tránh Nginx
    # ghi đè và làm mất các header bảo mật ở cấp server.
    # --------------------------------------------------------------------------

    # Service Worker: không cache để đảm bảo client nhận bản cập nhật tức thì
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Manifest: cache ngắn hạn cho PWA installable
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Data files (Network-first dataset)
    # Fail-closed với =404: request file JSON không tồn tại sẽ trả 404 thay vì SPA index.html
    location /data/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Stylesheet và Script ứng dụng
    # Fail-closed với =404: request file css/js không tồn tại sẽ trả 404 thay vì index.html
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static Binary Assets & Fonts
    # Fail-closed với =404
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA Routing Fallback (chỉ phục vụ các URL điều hướng ứng dụng)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL Certificate
    ssl_certificate /etc/letsencrypt/live/danabus.638686.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danabus.638686.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
