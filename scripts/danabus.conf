# ==============================================================================
# NGINX CONFIGURATION FOR DANABUS PWA (danabus.638686.xyz)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name danabus.638686.xyz;

    # Cho phép Let's Encrypt Certbot xác thực SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name danabus.638686.xyz;

    root /home/opc/danabus;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/manifest+json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service Worker & Manifest (không cache sw.js để cập nhật tức thì)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Data files (Network-first / fresh validation dataset)
    location /data/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # Mutable Application Code & Styles (Revalidate with server ETag)
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # Static Binary Assets & Fonts Cache
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL Certificate (Cập nhật sau khi chạy Certbot)
    ssl_certificate /etc/letsencrypt/live/danabus.638686.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danabus.638686.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
